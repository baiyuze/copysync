name: CI

on:
  push:
    # windows：Windows 客户端开发中，合进 main 之前也要在 Windows 构建机上验证
    branches: [main, windows]
  pull_request:
  # 手动运行：开发中的分支（比如 windows）不必合进 main 也能跑一遍
  workflow_dispatch:

jobs:
  server:
    name: 服务器
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./... && go test ./...
        working-directory: server

  client-core:
    name: 后台服务
    # 剪贴板部分是 cgo + AppKit，只能在 macOS 上编译
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client-core/go.mod
          cache-dependency-path: client-core/go.sum
      - run: go vet ./... && go test ./...
        working-directory: client-core

  ui:
    name: 界面
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: ui

  natlab:
    name: NAT 打洞实验室
    # 用网络命名空间与 iptables 搭出多出口、对称 NAT 等拓扑，验证直连与中转兜底
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client-core/go.mod
          cache-dependency-path: client-core/go.sum
      - run: CGO_ENABLED=0 go build -o /tmp/natlab ./cmd/natlab
        working-directory: client-core
      - run: sudo bash tools/natlab/run.sh /tmp/natlab

  windows:
    name: Windows 客户端
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client-core/go.mod
          cache-dependency-path: client-core/go.sum
      - run: go vet ./... ; if ($LASTEXITCODE) { exit 1 } ; go test ./...
        working-directory: client-core
      # 单独列出剪贴板测试的每一条：没有交互式桌面时它们会跳过，要看得出来
      - run: go test -v -count=1 -run Windows ./internal/clipboard/
        working-directory: client-core
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get ; flutter analyze ; if ($LASTEXITCODE) { exit 1 } ; flutter test
        working-directory: ui
      - name: 安装 Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - run: powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1
      # 构建好的安装包与便携版留作下载，方便在真机上试
      - uses: actions/upload-artifact@v4
        with:
          name: CopySync-windows
          path: |
            dist/windows/CopySync-Setup.exe
            dist/windows/CopySync-windows-x64.zip
