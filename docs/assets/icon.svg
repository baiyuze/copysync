<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="CopySync">
  <!-- 几何与 tools/icon/render.swift 一一对应，改动时两边同步 -->
  <defs>
    <linearGradient id="body" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBFBFA"/>
      <stop offset="1" stop-color="#E8E8E6"/>
    </linearGradient>
    <filter id="bodyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="sheetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#body)" filter="url(#bodyShadow)"/>
  <rect x="230" y="220" width="340" height="420" rx="44" fill="#F5F5F4" stroke="#2C2C2E" stroke-width="28"/>
  <g fill="#2C2C2E" fill-opacity="0.85">
    <rect x="290" y="310" width="200" height="30" rx="15"/>
    <rect x="290" y="390" width="150" height="30" rx="15"/>
    <rect x="290" y="470" width="104" height="30" rx="15"/>
  </g>
  <rect x="454" y="384" width="340" height="420" rx="44" fill="#0A66D8" filter="url(#sheetShadow)"/>
  <g fill="#FFFFFF" fill-opacity="0.95">
    <rect x="514" y="474" width="200" height="30" rx="15"/>
    <rect x="514" y="554" width="150" height="30" rx="15"/>
    <rect x="514" y="634" width="104" height="30" rx="15"/>
  </g>
</svg>
